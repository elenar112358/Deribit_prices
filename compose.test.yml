services:
  test_db:
    image: postgres:18-alpine3.23
    environment:
      POSTGRES_DB: ss_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U test_user -d ss_test_db"]
#      interval: 2s
#      timeout: 5s
#      retries: 10
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U test_user -d ss_test_db" ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: pytest -v
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://test_user:test_password@test_db:5432/ss_test_db
    depends_on:
      test_db:
        condition: service_healthy


